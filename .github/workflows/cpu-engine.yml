name: cpu-engine

# Builds the CPU inference engine on its own (no Pulp SDK, no GPU), runs its unit
# suites, and checks that every rendered output sample is unchanged.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Configure
        run: cmake -S tools/cpu-engine -B build-cpu -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-cpu -j4
      - name: Unit suites
        run: ctest --test-dir build-cpu --output-on-failure
      - name: Output is byte-identical to the stored hashes
        run: python3 tools/cpu-engine/render_hashes.py --render build-cpu/gpu-nam-golden-render
