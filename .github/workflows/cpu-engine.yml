name: cpu-engine

# Builds the CPU inference engine on its own (no Pulp SDK, no GPU), runs its unit
# suites, and checks that every rendered output sample is unchanged.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update:
        description: "Re-record this runner's hashes and upload render-hashes.json as an artifact"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cpu-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Pinned compiler: the stored linux-x86_64 hashes were recorded with GCC 13.
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Configure
        run: cmake -S tools/cpu-engine -B build-cpu -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-cpu -j4
      - name: Unit suites
        run: ctest --test-dir build-cpu --output-on-failure
      - name: Output is byte-identical to the stored hashes
        if: ${{ !inputs.update }}
        run: python3 tools/cpu-engine/render_hashes.py --render build-cpu/gpu-nam-golden-render
      - name: Re-record this runner's hashes
        if: ${{ inputs.update }}
        run: python3 tools/cpu-engine/render_hashes.py --render build-cpu/gpu-nam-golden-render --update
      - name: Upload re-recorded hashes
        if: ${{ inputs.update }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: render-hashes
          path: tools/cpu-engine/render-hashes.json
